# Render Blueprint — servidor da loja MIXMIND com disco persistente (base de dados, comprovativos, chave das licenças)
services:
  - type: web
    name: mixmind-loja
    runtime: docker
    plan: starter
    healthCheckPath: /api/public/store
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_MODE
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      # a app é servida por este servidor em /app/ (mesmo domínio da loja)
      - key: APP_URL
        value: /app/
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      # repor o acesso do administrador (aplica-se uma vez; troca obrigatória no 1.º acesso) — apaga depois
      - key: ADMIN_RESET_PASSWORD
        sync: false
      # beta testers: utilizador:hash[:AAAA-MM-DD] separados por espaço (só hashes, nunca palavras-passe)
      - key: BETA_ACESSOS
        sync: false
      - key: EMAIL_PROVIDER
        value: outbox
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
